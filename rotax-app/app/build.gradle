plugins { id 'com.android.application' }

android {
    namespace 'com.tufan.servisyonetim'
    compileSdk 35

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.rotax.yonetim'
        minSdk 24
        targetSdk 35
        versionCode 20000
        versionName '2.0.0'
    }

    def keyFile = System.getenv('ROTAX_KEYSTORE_FILE')
    def keyPass = System.getenv('ROTAX_KEY_PASSWORD')
    signingConfigs {
        if (keyFile && keyPass) {
            release {
                storeFile file(keyFile)
                storePassword keyPass
                keyAlias 'servis-release'
                keyPassword keyPass
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
