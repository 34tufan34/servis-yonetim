plugins {
    id 'com.android.application'
}

def appVersionFile = rootProject.file("../scripts/app-version.js")

if (!appVersionFile.exists()) {
    throw new GradleException("scripts/app-version.js bulunamadı.")
}

def appVersionSource = appVersionFile.getText("UTF-8")
def appVersionMatcher = appVersionSource =~ /const VERSION = "([^"]+)"/

if (!appVersionMatcher.find()) {
    throw new GradleException("app-version.js içinde VERSION değeri bulunamadı.")
}

def unifiedVersionName = appVersionMatcher.group(1)
def versionParts = unifiedVersionName.tokenize(".").collect { it as int }

if (versionParts.size() != 3) {
    throw new GradleException("Sürüm numarası 4.48.21 biçiminde olmalıdır.")
}

def githubRunNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int
def unifiedVersionCode = (versionParts[0] * 100000000) + (versionParts[1] * 1000000) + (versionParts[2] * 10000) + Math.min(githubRunNumber, 9999)

android {
    namespace 'com.tufan.servisyonetim'
    compileSdk 35
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tufan.servisyonetim.komuta.v44849"
        minSdk 24
        targetSdk 35
        versionCode unifiedVersionCode
        versionName unifiedVersionName
    }

    def releaseKeystorePath = System.getenv("SERVIS_KEYSTORE_FILE")
    def releaseStorePassword = System.getenv("SERVIS_STORE_PASSWORD")
    def releaseKeyAlias = System.getenv("SERVIS_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("SERVIS_KEY_PASSWORD")

    signingConfigs {
        if (releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
